<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14161a" />
    <title>Task Tracker</title>

    <!-- Installed to the home screen: standalone window, dark chrome. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tracker" />
    <!-- black-translucent lets the page's own background show through the
         status bar, so it matches the app instead of sitting in a black band.
         It also means content runs under the notch, which is why the viewport
         is viewport-fit=cover and the layout pads with env(safe-area-inset-*). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <link rel="stylesheet" href="/css/app.css" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  </head>
  <body>
    <!-- Header and tabs stick together as one block, so neither slides under
         the other while the list scrolls. -->
    <div class="app-top">
      <header class="app-header">
        <h1>Task Tracker</h1>
        <div class="header-right">
          <span id="clock" class="clock" aria-live="off"></span>
          <button id="refresh" class="icon-button" type="button" title="Refresh" aria-label="Refresh">
            ⟳
          </button>
        </div>
      </header>

      <nav class="tabs" aria-label="Pages">
        <a href="#/overview" data-tab="overview"><span aria-hidden="true">▦</span> Overview</a>
        <a href="#/upcoming" data-tab="upcoming"><span aria-hidden="true">○</span> Upcoming <span class="badge" data-count="upcoming"></span></a>
        <a href="#/progress" data-tab="progress"><span aria-hidden="true">▶</span> Progress <span class="badge" data-count="progress"></span></a>
        <a href="#/finished" data-tab="finished"><span aria-hidden="true">✓</span> Finished <span class="badge" data-count="finished"></span></a>
        <a href="#/calendar" data-tab="calendar"><span aria-hidden="true">▤</span> Calendar</a>
        <a href="#/exercise" data-tab="exercise"><span aria-hidden="true">⏱</span> Exercise</a>
      </nav>
    </div>

    <main id="view" class="view" aria-live="polite"></main>

    <!-- Shared modal: task details / finish notes / new task -->
    <div id="modal-backdrop" class="modal-backdrop" hidden>
      <div
        id="modal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <h2 id="modal-title"></h2>
        <div id="modal-body"></div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
